<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- ==================== FIREBASE SDK ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {
            getAuth, createUserWithEmailAndPassword,
            signInWithEmailAndPassword, signOut, onAuthStateChanged,
            GoogleAuthProvider, signInWithPopup, updateProfile
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import {
            getFirestore, collection, addDoc, getDocs, getDoc,
            query, where, deleteDoc, doc, updateDoc, serverTimestamp,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFir3jDFzRUMEG3PjqVBCgYP5uc1edTDE",
            authDomain: "quiz-builder-2ecc7.firebaseapp.com",
            projectId: "quiz-builder-2ecc7",
            storageBucket: "quiz-builder-2ecc7.firebasestorage.app",
            messagingSenderId: "341139715457",
            appId: "1:341139715457:web:b68133ba5b552b53766480"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ===== API в глобальное пространство =====
        window.fb = {
            auth, db,

            async register(email, password, name) {
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    if (name) await updateProfile(cred.user, { displayName: name });
                    return { ok: true, user: cred.user };
                } catch (e) { return { ok: false, error: translateError(e.code) }; }
            },

            async login(email, password) {
                try {
                    const cred = await signInWithEmailAndPassword(auth, email, password);
                    return { ok: true, user: cred.user };
                } catch (e) { return { ok: false, error: translateError(e.code) }; }
            },

            async loginGoogle() {
                try {
                    const provider = new GoogleAuthProvider();
                    const cred = await signInWithPopup(auth, provider);
                    return { ok: true, user: cred.user };
                } catch (e) { return { ok: false, error: translateError(e.code) }; }
            },

            async logout() { await signOut(auth); },

            onAuthChange(cb) { onAuthStateChanged(auth, cb); },

            async saveQuiz(quizData) {
                if (!auth.currentUser) return { ok: false, error: 'Не авторизован' };
                try {
                    const docRef = await addDoc(collection(db, 'quizzes'), {
                        ...quizData,
                        teacherId: auth.currentUser.uid,
                        teacherEmail: auth.currentUser.email,
                        teacherName: auth.currentUser.displayName || '',
                        createdAt: serverTimestamp()
                    });
                    return { ok: true, id: docRef.id };
                } catch (e) { return { ok: false, error: e.message }; }
            },

            async getMyQuizzes() {
                if (!auth.currentUser) return [];
                try {
                    const q = query(collection(db, 'quizzes'), where('teacherId', '==', auth.currentUser.uid));
                    const snap = await getDocs(q);
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    return list;
                } catch (e) { console.error(e); return []; }
            },

            async getQuiz(quizId) {
                try {
                    const d = await getDoc(doc(db, 'quizzes', quizId));
                    if (d.exists()) return { id: d.id, ...d.data() };
                    return null;
                } catch (e) { return null; }
            },

            async deleteQuiz(quizId) {
                try { await deleteDoc(doc(db, 'quizzes', quizId)); return { ok: true }; }
                catch (e) { return { ok: false, error: e.message }; }
            },

            async saveResult(quizId, result) {
                try {
                    await addDoc(collection(db, 'results'), {
                        quizId, ...result, createdAt: serverTimestamp()
                    });
                    return { ok: true };
                } catch (e) { return { ok: false, error: e.message }; }
            },

            subscribeResults(quizId, callback) {
                const q = query(collection(db, 'results'), where('quizId', '==', quizId));
                return onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    callback(list);
                });
            }
        };

        function translateError(code) {
            const map = {
                'auth/email-already-in-use': 'Этот email уже зарегистрирован',
                'auth/invalid-email': 'Неверный формат email',
                'auth/weak-password': 'Пароль слишком простой (минимум 6 символов)',
                'auth/user-not-found': 'Пользователь не найден',
                'auth/wrong-password': 'Неверный пароль',
                'auth/invalid-credential': 'Неверный email или пароль',
                'auth/too-many-requests': 'Слишком много попыток, попробуйте позже',
                'auth/popup-closed-by-user': 'Окно входа закрыто',
                'auth/network-request-failed': 'Нет подключения к интернету',
                'auth/operation-not-allowed': 'Этот способ входа не включён в Firebase',
                'auth/unauthorized-domain': 'Домен не разрешён в Firebase'
            };
            return map[code] || 'Ошибка: ' + code;
        }

        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

        .switch {

            display: flex; justify-content: space-between;
            align-items: center; gap: 1rem; flex-wrap: wrap;

        @media (max-width: 600px) {

            .app { padding: 1.2rem 1rem 1.6rem; }

            .tab-btn { padding: 0.6rem 0.8rem; font-size: 0.85rem; }
            .question-card { padding: 0.9rem; }
            .option-row input[type="text"] { font-size: 0.85rem; }
            .saved-item { padding: 0.8rem; }
            .student-score { font-size: 0.95rem; padding: 0.3rem 0.7rem; }
            .auth-wrap { padding: 1.4rem 1.2rem; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="bg-gradient"></div>

    <div class="save-progress" id="saveProgress">
        <div class="save-progress-fill" id="saveProgressFill"></div>
    </div>

    <div class="app" id="appRoot">
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-spinner"></div>
            <div>Загрузка...</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== ФОН ====================
        (function() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let width, height, blobs = [];
            const BLOB_COUNT = 6;
            const TARGET_FPS = 24;
            const FRAME_INTERVAL = 1000 / TARGET_FPS;
            let lastTime = 0;

            const COLORS = [
                { r: 245, g: 235, b: 220 }, { r: 235, g: 230, b: 225 },
                { r: 240, g: 240, b: 235 }, { r: 250, g: 245, b: 235 },
                { r: 230, g: 228, b: 225 }, { r: 248, g: 242, b: 230 }
            ];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                if (blobs.length === 0) initBlobs();
            }

            function initBlobs() {
                blobs = [];
                for (let i = 0; i < BLOB_COUNT; i++) blobs.push(createBlob());
            }

            function createBlob() {
                const color = COLORS[Math.floor(Math.random() * COLORS.length)];
                return {
                    x: Math.random() * width, y: Math.random() * height,
                    r: 180 + Math.random() * 220,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: (Math.random() - 0.5) * 0.25,
                    color, alpha: 0.55 + Math.random() * 0.25,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.004 + Math.random() * 0.006
                };
            }

            function update() {
                for (const b of blobs) {
                    b.x += b.vx; b.y += b.vy;
                    if (b.x < -b.r) b.x = width + b.r;
                    if (b.x > width + b.r) b.x = -b.r;
                    if (b.y < -b.r) b.y = height + b.r;
                    if (b.y > height + b.r) b.y = -b.r;
                    b.pulse += b.pulseSpeed;
                }
            }

            function draw() {
                ctx.fillStyle = '#f5f2ec';
                ctx.fillRect(0, 0, width, height);
                for (const b of blobs) {
                    const pulseFactor = 1 + Math.sin(b.pulse) * 0.15;
                    const r = b.r * pulseFactor;
                    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, r);
                    grad.addColorStop(0, `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, ${b.alpha})`);
                    grad.addColorStop(0.5, `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, ${b.alpha * 0.4})`);
                    grad.addColorStop(1, `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function loop(now) {
                if (now - lastTime >= FRAME_INTERVAL) {
                    lastTime = now; update(); draw();
                }
                requestAnimationFrame(loop);
            }

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(loop);
        })();

        // ==================== УТИЛИТЫ ====================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        function showToast(msg) {
            const t = $('#toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 2600);
        }

        function throwConfetti() {
            const container = document.createElement('div');
            container.className = 'confetti';
            document.body.appendChild(container);
            const colors = ['#a89b88', '#6b5f4f', '#d4c5a8', '#8a7a65', '#b8ab98', '#e8ddc5'];
            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.top = '-20px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (2 + Math.random() * 2) + 's';
                piece.style.animationDelay = (Math.random() * 0.5) + 's';
                if (Math.random() > 0.5) {
                    piece.style.borderRadius = '50%';
                    piece.style.width = '10px';
                    piece.style.height = '10px';
                }
                container.appendChild(piece);
            }
            setTimeout(() => container.remove(), 4500);
        }

        function showSaveProgress() {
            const bar = $('#saveProgress');
            const fill = $('#saveProgressFill');
            bar.classList.add('active');
            let p = 0;
            fill.style.width = '0%';
            const iv = setInterval(() => {
                p += 8 + Math.random() * 12;
                if (p >= 100) {
                    p = 100;
                    fill.style.width = '100%';
                    clearInterval(iv);
                    setTimeout(() => { bar.classList.remove('active'); fill.style.width = '0%'; }, 400);
                } else {
                    fill.style.width = p + '%';
                }
            }, 100);
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s == null ? '' : String(s);
            return div.innerHTML;
        }

        function whenFirebaseReady(cb) {
            if (window.firebaseReady) { cb(); return; }
            window.addEventListener('firebase-ready', cb, { once: true });
        }

        // ==================== СОСТОЯНИЕ ====================
        const state = {
            user: null,
            quizzes: [],
            unsubscribeResults: null
        };

        // ==================== СТАРТ ====================
        whenFirebaseReady(() => {
            if (checkHashForStudent()) return;

            window.fb.onAuthChange((user) => {
                state.user = user;
                if (user) renderTeacherApp();
                else renderAuthScreen();
            });
        });

        // ==================== ПРОВЕРКА URL ====================
        function checkHashForStudent() {
            const hash = window.location.hash;
            if (!hash) return false;

            if (hash.startsWith('#quiz=')) {
                const quizId = hash.slice(6);
                loadQuizForStudent(quizId);
                return true;
            }
            return false;
        }

        async function loadQuizForStudent(quizId) {
            const appRoot = document.getElementById('appRoot');
            appRoot.innerHTML = `
                <div class="loading-screen">
                    <div class="loading-spinner"></div>
                    <div>Загружаем викторину...</div>
                </div>
            `;
            const quiz = await window.fb.getQuiz(quizId);
            if (!quiz) {
                appRoot.innerHTML = `
                    <div style="text-align:center; padding:3rem 1rem;">
                        <div style="font-size:2rem; margin-bottom:1rem; opacity:0.4;">—</div>
                        <div style="color:#8a7f70;">Викторина не найдена или удалена</div>
                    </div>
                `;
                return;
            }
            showStudentFlow(quiz, quizId);
        }

        // ==================== ЭКРАН ВХОДА ====================
        function renderAuthScreen() {
            const appRoot = document.getElementById('appRoot');
            appRoot.innerHTML = `
                <div class="app-header">
                    <h1>Конструктор викторин</h1>
                    <div class="sub">войдите или создайте аккаунт учителя</div>
                </div>
                <div class="auth-wrap">
                    <div class="auth-switch">
                        <button class="active" id="switchLogin">Вход</button>
                        <button id="switchRegister">Регистрация</button>
                    </div>
                    <h2 id="authTitle">С возвращением!</h2>
                    <div class="auth-sub" id="authSub">Войдите в свой аккаунт</div>
                    <div class="auth-error" id="authError"></div>
                    <div class="auth-field" id="nameField" style="display:none;">
                        <label>Ваше имя</label>
                        <input type="text" id="authName" placeholder="Иванова Анна Петровна" maxlength="80">
                    </div>
                    <div class="auth-field">
                        <label>Email</label>
                        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <div class="auth-field">
                        <label>Пароль</label>
                        <input type="password" id="authPassword" placeholder="Минимум 6 символов" autocomplete="current-password">
                    </div>
                    <button class="btn btn-primary btn-block" id="authSubmit">Войти</button>
                    <div class="auth-divider">или</div>
                    <button class="btn btn-google" id="googleBtn">
                        <svg viewBox="0 0 48 48">
                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.3-.1-3.5z"/>
                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C41 35.5 44 30.2 44 24c0-1.3-.1-2.3-.4-3.5z"/>
                        </svg>
                        Войти через Google
                    </button>
                </div>
            `;

            let mode = 'login';
            const switchLogin = $('#switchLogin');
            const switchRegister = $('#switchRegister');
            const authError = $('#authError');
            const authSubmit = $('#authSubmit');

            function setMode(m) {
                mode = m;
                if (m === 'login') {
                    switchLogin.classList.add('active');
                    switchRegister.classList.remove('active');
                    $('#authTitle').textContent = 'С возвращением!';
                    $('#authSub').textContent = 'Войдите в свой аккаунт';
                    $('#nameField').style.display = 'none';
                    authSubmit.textContent = 'Войти';
                } else {
                    switchRegister.classList.add('active');
                    switchLogin.classList.remove('active');
                    $('#authTitle').textContent = 'Регистрация';
                    $('#authSub').textContent = 'Создайте аккаунт учителя';
                    $('#nameField').style.display = 'block';
                    authSubmit.textContent = 'Создать аккаунт';
                }
                authError.classList.remove('show');
            }

            switchLogin.addEventListener('click', () => setMode('login'));
            switchRegister.addEventListener('click', () => setMode('register'));

            authSubmit.addEventListener('click', async () => {
                const email = $('#authEmail').value.trim();
                const password = $('#authPassword').value;
                const name = $('#authName').value.trim();

                if (!email || !password) {
                    authError.textContent = 'Заполните email и пароль';
                    authError.classList.add('show');
                    return;
                }
                if (password.length < 6) {
                    authError.textContent = 'Пароль должен быть не менее 6 символов';
                    authError.classList.add('show');
                    return;
                }

                authSubmit.disabled = true;
                authSubmit.textContent = 'Подождите...';

                const result = mode === 'login'
                    ? await window.fb.login(email, password)
                    : await window.fb.register(email, password, name);

                authSubmit.disabled = false;
                authSubmit.textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';

                if (!result.ok) {
                    authError.textContent = result.error;
                    authError.classList.add('show');
                }
            });

            $('#googleBtn').addEventListener('click', async () => {
                authError.classList.remove('show');
                const result = await window.fb.loginGoogle();
                if (!result.ok) {
                    authError.textContent = result.error;
                    authError.classList.add('show');
                }
            });

            ['authEmail', 'authPassword', 'authName'].forEach(id => {
                const el = $('#' + id);
                if (el) el.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') authSubmit.click();
                });
            });
        }

        // ==================== ПРИЛОЖЕНИЕ УЧИТЕЛЯ ====================
        function renderTeacherApp() {
            const appRoot = document.getElementById('appRoot');
            const user = state.user;
            const initial = (user.displayName || user.email || '?').trim().charAt(0).toUpperCase();

            appRoot.innerHTML = `

                </div>

                <div class="user-bar">

                            <div class="user-email">${escapeHtml(user.displayName || user.email)}</div>

                    </div>

                    </div>
                </div>

                <div class="tabs">

                    <button class="tab-btn" data-tab="saved">Мои викторины</button>
                    <button class="tab-btn" data-tab="students">Ученики</button>
                    <button class="tab-btn" data-tab="help">Помощь</button>
                </div>

                <div class="panel active" id="panel-create">
                    <div class="field">
                        <label>Название викторины</label>
                        <input type="text" id="quizTitle" placeholder="Например: Основы информатики — 8 класс" maxlength="120">
                    </div>
                    <div class="field">
                        <label>Краткое описание (необязательно)</label>
                        <textarea id="quizDesc" placeholder="Проверочная работа по теме «Алгоритмы»" maxlength="300"></textarea>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Количество вопросов</label>
                            <input type="number" id="quizCount" min="1" max="50" value="3">
                            <div class="hint">от 1 до 50</div>
                        </div>
                        <div class="field">
                            <label>Имя учителя (необязательно)</label>
                            <input type="text" id="teacherName" placeholder="Иванова А. П." maxlength="60" value="${escapeHtml(user.displayName || '')}">
                        </div>
                    </div>
                    <div class="toggle-row on" id="studentModeRow">
                        <div class="toggle-info">
                            <div class="title">Режим учеников</div>
                            <div class="desc">Ученик перед началом вводит имя и класс. Результат сохраняется в облаке.</div>
                        </div>
                        <label class="switch">
                            <input type="checkbox" id="studentModeToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <button class="btn btn-primary btn-block" id="generateBtn">Создать форму вопросов</button>
                    <div id="questionsWrap" style="margin-top: 1.5rem;"></div>
                    <div id="linkSection" style="margin-top: 1.5rem; display: none;">
                        <div style="padding-top: 1.2rem; border-top: 1px solid rgba(180, 170, 155, 0.3);">
                            <label style="display:block; font-size:0.9rem; font-weight:600; color:#4a4238; margin-bottom:0.6rem;">
                                Ссылка для учеников
                            </label>
                            <div class="link-box">
                                <input type="text" id="shareLink" readonly>
                                <button class="btn btn-primary btn-small" id="copyLinkBtn">Копировать</button>
                                <button class="btn btn-secondary btn-small" id="openLinkBtn">Открыть</button>
                            </div>
                            <div class="hint">Отправьте ссылку ученикам. Они увидят форму с именем и пройдут викторину. Результаты появятся во вкладке «Ученики».</div>
                        </div>
                    </div>
                </div>

                <div class="panel" id="panel-saved">
                    <div id="savedList"></div>
                </div>

                <div class="panel" id="panel-students">
                    <div class="field">
                        <label>Выберите викторину</label>
                        <select id="studentQuizSelect" style="width:100%; padding:0.7rem 0.9rem; font-size:0.95rem; font-family:inherit; color:#3a3530; background:#fff; border:1px solid rgba(180,170,155,0.5); border-radius:0.5rem;">
                            <option value="">— выберите —</option>
                        </select>
                    </div>
                    <div id="studentsContent"></div>
                </div>

                <div class="panel" id="panel-help">
                    <div style="max-width:640px; margin:0 auto;">
                        <h2 style="font-family:'Unbounded',sans-serif; font-size:1.1rem; color:#4a4238; margin-bottom:1.2rem; text-transform:uppercase; letter-spacing:0.5px;">
                            Как работает система
                        </h2>
                        <div style="background:#fdfbf6; border-radius:0.6rem; padding:1.2rem 1.4rem; border:1px solid rgba(180,170,155,0.35); margin-bottom:1rem;">
                            <div style="font-weight:600; color:#4a4238; margin-bottom:0.5rem;">1. Создайте викторину</div>
                            <div style="font-size:0.9rem; color:#6b5f4f;">Заполните вопросы, включите режим учеников и нажмите «Сохранить». Викторина загрузится в облако.</div>
                        </div>
                        <div style="background:#fdfbf6; border-radius:0.6rem; padding:1.2rem 1.4rem; border:1px solid rgba(180,170,155,0.35); margin-bottom:1rem;">
                            <div style="font-weight:600; color:#4a4238; margin-bottom:0.5rem;">2. Отправьте ссылку</div>
                            <div style="font-size:0.9rem; color:#6b5f4f;">Ученики открывают ссылку, вводят имя, проходят викторину. Результат сразу летит в облако.</div>
                        </div>
                        <div style="background:#fdfbf6; border-radius:0.6rem; padding:1.2rem 1.4rem; border:1px solid rgba(180,170,155,0.35);">
                            <div style="font-weight:600; color:#4a4238; margin-bottom:0.5rem;">3. Смотрите результаты</div>
                            <div style="font-size:0.9rem; color:#6b5f4f;">Во вкладке «Ученики» видны все прохождения в реальном времени — с любого устройства.</div>
                        </div>
                    </div>
                </div>
            `;

            $('#logoutBtn').addEventListener('click', async () => {
                if (state.unsubscribeResults) { state.unsubscribeResults(); state.unsubscribeResults = null; }
                await window.fb.logout();
            });

            $$('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    $$('.tab-btn').forEach(b => b.classList.remove('active'));
                    $$('.panel').forEach(p => p.classList.remove('active'));
                    btn.classList.add('active');
                    $('#panel-' + btn.dataset.tab).classList.add('active');
                    if (btn.dataset.tab === 'saved') renderSavedList();
                    if (btn.dataset.tab === 'students') renderStudentsPanel();
                });
            });

            const toggle = $('#studentModeToggle');
            const row = $('#studentModeRow');
            function updateToggle() {
                if (toggle.checked) row.classList.add('on');
                else row.classList.remove('on');
            }
            toggle.addEventListener('change', updateToggle);
            updateToggle();

            $('#generateBtn').addEventListener('click', () => {
                const title = $('#quizTitle').value.trim();
                const count = parseInt($('#quizCount').value);
                if (!title) { showToast('Введите название'); $('#quizTitle').focus(); return; }
                if (!count || count < 1 || count > 50) { showToast('Количество вопросов: 1–50'); return; }
                renderQuestionsForm(count);
            });

            loadQuizzes();
        }

        async function loadQuizzes() {
            state.quizzes = await window.fb.getMyQuizzes();
        }

        // ==================== ФОРМА ВОПРОСОВ ====================
        let questionsWrap, linkSection;

        function renderQuestionsForm(count) {
            questionsWrap = $('#questionsWrap');
            linkSection = $('#linkSection');
            questionsWrap.innerHTML = '';
            const header = document.createElement('div');
            header.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;';
            header.innerHTML = `
                <div style="font-family:'Unbounded',sans-serif; font-size:0.95rem; font-weight:600; color:#4a4238;">Вопросы: ${count}</div>
                <button class="btn btn-secondary btn-small" id="saveBtn">Сохранить и получить ссылку</button>
            `;
            questionsWrap.appendChild(header);

            for (let i = 0; i < count; i++) {
                const card = createQuestionCard(i);
                card.style.animationDelay = (i * 0.06) + 's';
                questionsWrap.appendChild(card);
            }

            $('#saveBtn').addEventListener('click', saveQuizToCloud);
            linkSection.style.display = 'none';
            questionsWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function createQuestionCard(index) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.index = index;

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">Вопрос ${index + 1}</span>
                    <button class="btn btn-danger btn-small remove-btn">Удалить</button>
                </div>
                <div class="field" style="margin-bottom:0.8rem;">
                    <input type="text" class="q-text" placeholder="Текст вопроса..." maxlength="300">
                </div>
                <div class="options-wrap">
                    ${[0, 1, 2, 3].map(n => `
                        <div class="option-row" style="animation-delay:${n * 0.05}s">
                            <input type="radio" name="correct-${index}" value="${n}" ${n === 0 ? 'checked' : ''}>
                            <input type="text" class="opt-text" placeholder="Вариант ${n + 1}" maxlength="200">
                            ${n === 0 ? '<span class="correct-label">верный</span>' : ''}
                        </div>
                    `).join('')}
                </div>
            `;

            const radios = card.querySelectorAll(`input[name="correct-${index}"]`);
            const labels = card.querySelectorAll('.correct-label');
            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    labels.forEach(l => l.remove());
                    const checked = card.querySelector(`input[name="correct-${index}"]:checked`);
                    if (checked) {
                        const row2 = checked.closest('.option-row');
                        const span = document.createElement('span');
                        span.className = 'correct-label';
                        span.textContent = 'верный';
                        row2.appendChild(span);
                    }
                });
            });

            card.querySelector('.remove-btn').addEventListener('click', () => {
                card.style.transition = 'opacity 0.25s, transform 0.25s';
                card.style.opacity = '0';
                card.style.transform = 'translateX(-20px)';
                setTimeout(() => {
                    card.remove();
                    const cards = questionsWrap.querySelectorAll('.question-card');
                    cards.forEach((c, i) => {
                        c.dataset.index = i;
                        c.querySelector('.q-num').textContent = `Вопрос ${i + 1}`;
                        c.querySelectorAll('input[type="radio"]').forEach(r => { r.name = `correct-${i}`; });
                    });
                }, 250);
            });

            return card;
        }

        // ==================== СОХРАНЕНИЕ ====================
        async function saveQuizToCloud() {
            const title = $('#quizTitle').value.trim();
            const desc = $('#quizDesc').value.trim();
            const teacher = $('#teacherName').value.trim();
            const studentMode = $('#studentModeToggle').checked;

            if (!title) { showToast('Введите название'); return; }

            const cards = questionsWrap.querySelectorAll('.question-card');
            if (cards.length === 0) { showToast('Добавьте хотя бы один вопрос'); return; }

            const questions = [];
            for (let i = 0; i < cards.length; i++) {
                const card = cards[i];
                const text = card.querySelector('.q-text').value.trim();
                const optInputs = card.querySelectorAll('.opt-text');
                const options = Array.from(optInputs).map(inp => inp.value.trim());
                const correctRadio = card.querySelector(`input[name="correct-${i}"]:checked`);
                const correct = correctRadio ? parseInt(correctRadio.value) : 0;

                if (!text) { showToast(`Заполните вопрос №${i + 1}`); card.querySelector('.q-text').focus(); return; }
                const emptyOpt = options.findIndex(o => !o);
                if (emptyOpt !== -1) { showToast(`Заполните все варианты в вопросе №${i + 1}`); optInputs[emptyOpt].focus(); return; }

                questions.push({ text, options, correct });
            }

            showSaveProgress();

            const result = await window.fb.saveQuiz({
                title, desc, teacher, questions, studentMode
            });

            if (!result.ok) {
                showToast('Ошибка сохранения: ' + result.error);
                return;
            }

            const base = window.location.origin + window.location.pathname;
            const link = base + '#quiz=' + result.id;
            $('#shareLink').value = link;
            linkSection.style.display = 'block';

            showToast('Викторина сохранена в облаке!');
            throwConfetti();
            linkSection.scrollIntoView({ behavior: 'smooth', block: 'center' });

            await loadQuizzes();
        }

        // ==================== КОПИРОВАНИЕ ====================
        document.addEventListener('click', (e) => {
            if (e.target.id === 'copyLinkBtn') {
                const input = $('#shareLink');
                if (!input.value) return;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(input.value).then(() => showToast('Ссылка скопирована'))
                    .catch(() => { input.select(); document.execCommand('copy'); showToast('Скопировано'); });
                } else {
                    input.select(); document.execCommand('copy'); showToast('Скопировано');
                }
            }
            if (e.target.id === 'openLinkBtn') {
                const link = $('#shareLink').value;
                if (link) window.open(link, '_blank');
            }
        });

        // ==================== СПИСОК ВИКТОРИН ====================
        async function renderSavedList() {
            const list = $('#savedList');
            list.innerHTML = '<div class="loading-screen" style="padding:1.5rem 0;"><div class="loading-spinner" style="width:32px;height:32px;"></div></div>';

            const quizzes = await window.fb.getMyQuizzes();
            state.quizzes = quizzes;

            if (quizzes.length === 0) {
                list.innerHTML = '<div class="empty"><div class="big">—</div><div>Пока нет созданных викторин</div></div>';
                return;
            }

            list.innerHTML = '';
            for (const quiz of quizzes) {
                const item = document.createElement('div');
                item.className = 'saved-item';
                const date = quiz.createdAt
                    ? new Date(quiz.createdAt.seconds * 1000).toLocaleDateString('ru-RU', {
                        day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    })
                    : '—';
                item.innerHTML = `
                    <div class="info">
                        <div class="title">${escapeHtml(quiz.title)}</div>
                        <div class="meta">${quiz.questions.length} вопр. · ${date}${quiz.teacher ? ' · ' + escapeHtml(quiz.teacher) : ''}${quiz.studentMode ? ' · <span style="color:#7a9a7a; font-weight:600;">режим учеников</span>' : ''}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-secondary btn-small" data-action="link" data-id="${quiz.id}">Ссылка</button>
                        <button class="btn btn-secondary btn-small" data-action="students" data-id="${quiz.id}">Ученики</button>
                        <button class="btn btn-secondary btn-small" data-action="delete" data-id="${quiz.id}">Удалить</button>
                    </div>
                `;
                list.appendChild(item);
            }

            list.querySelectorAll('button[data-action]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;

                    if (action === 'link') {
                        const base = window.location.origin + window.location.pathname;
                        const link = base + '#quiz=' + id;
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(link).then(() => showToast('Ссылка скопирована'))
                            .catch(() => prompt('Скопируйте:', link));
                        } else {
                            prompt('Скопируйте:', link);
                        }
                    } else if (action === 'students') {
                        $$('.tab-btn').forEach(b => b.classList.remove('active'));
                        $$('.panel').forEach(p => p.classList.remove('active'));
                        document.querySelector('[data-tab="students"]').classList.add('active');
                        $('#panel-students').classList.add('active');
                        renderStudentsPanel(id);
                    } else if (action === 'delete') {
                        const quiz = state.quizzes.find(q => q.id === id);
                        if (confirm('Удалить викторину «' + (quiz?.title || '') + '»?')) {
                            const r = await window.fb.deleteQuiz(id);
                            if (r.ok) { showToast('Удалено'); renderSavedList(); }
                            else showToast('Ошибка: ' + r.error);
                        }
                    }
                });
            });
        }

        // ==================== ПАНЕЛЬ УЧЕНИКОВ ====================
        async function renderStudentsPanel(preselectedId) {
            const select = $('#studentQuizSelect');
            const quizzes = await window.fb.getMyQuizzes();
            state.quizzes = quizzes;

            select.innerHTML = '<option value="">— выберите —</option>';
            quizzes.forEach(q => {
                const opt = document.createElement('option');
                opt.value = q.id;
                opt.textContent = q.title;
                select.appendChild(opt);
            });

            if (preselectedId) select.value = preselectedId;
            select.onchange = () => renderStudentsContent(select.value);

            if (select.value) renderStudentsContent(select.value);
            else $('#studentsContent').innerHTML = '<div class="empty"><div class="big">—</div><div>Выберите викторину</div></div>';
        }

        function renderStudentsContent(quizId) {
            const content = $('#studentsContent');
            if (!quizId) {
                content.innerHTML = '<div class="empty"><div class="big">—</div><div>Выберите викторину</div></div>';
                return;
            }

            if (state.unsubscribeResults) {
                state.unsubscribeResults();
                state.unsubscribeResults = null;
            }

            content.innerHTML = '<div class="loading-screen" style="padding:1.5rem 0;"><div class="loading-spinner" style="width:32px;height:32px;"></div><div style="font-size:0.85rem;">Загружаем...</div></div>';

            state.unsubscribeResults = window.fb.subscribeResults(quizId, (results) => {
                if (results.length === 0) {
                    content.innerHTML = `
                        <div class="empty">
                            <div class="big">—</div>
                            <div>Пока никто не прошёл</div>
                            <div style="font-size:0.85rem; margin-top:0.5rem; color:#a89b88;">Отправьте ссылку из вкладки «Мои викторины»</div>
                        </div>
                    `;
                    return;
                }

                const total = results.length;
                const avg = Math.round(results.reduce((s, r) => s + (r.percent || 0), 0) / total);
                const best = Math.max(...results.map(r => r.percent || 0));
                const worst = Math.min(...results.map(r => r.percent || 0));

                let html = `
                    <div class="students-summary">
                        <div class="stat-card"><div class="value">${total}</div><div class="label">прошли</div></div>
                        <div class="stat-card"><div class="value">${avg}%</div><div class="label">средний</div></div>
                        <div class="stat-card"><div class="value">${best}%</div><div class="label">лучший</div></div>
                        <div class="stat-card"><div class="value">${worst}%</div><div class="label">худший</div></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; flex-wrap:wrap; gap:0.5rem;">
                        <div style="font-family:'Unbounded',sans-serif; font-size:0.9rem; font-weight:600; color:#4a4238;">Список учеников</div>
                        <button class="btn btn-secondary btn-small" id="exportCsvBtn">Скачать CSV</button>
                    </div>
                `;

                html += '<div id="studentsList">';
                results.forEach((r, i) => {
                    const pct = r.percent || 0;
                    const cls = pct >= 80 ? 'good' : (pct >= 50 ? 'mid' : 'bad');
                    const initial = (r.name || '?').trim().charAt(0).toUpperCase();
                    const date = r.createdAt
                        ? new Date(r.createdAt.seconds * 1000).toLocaleDateString('ru-RU', {
                            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                        })
                        : '—';
                    html += `
                        <div class="student-row" style="animation-delay:${i * 0.04}s">
                            <div class="student-info">
                                <div class="student-avatar">${escapeHtml(initial)}</div>
                                <div>
                                    <div class="student-name">${escapeHtml(r.name)}</div>
                                    <div class="student-class">${r.studentClass ? escapeHtml(r.studentClass) + ' · ' : ''}<span class="student-date">${date}</span></div>
                                </div>
                            </div>
                            <div class="student-score ${cls}">${r.score} / ${r.total} · ${pct}%</div>
                        </div>
                    `;
                });
                html += '</div>';

                content.innerHTML = html;

                $('#exportCsvBtn').addEventListener('click', () => {
                    const rows = [['Имя', 'Класс', 'Правильных', 'Всего', 'Процент', 'Дата']];
                    results.forEach(r => {
                        const d = r.createdAt
                            ? new Date(r.createdAt.seconds * 1000).toLocaleString('ru-RU')
                            : '';
                        rows.push([r.name, r.studentClass || '', r.score, r.total, (r.percent || 0) + '%', d]);
                    });
                    const csv = rows.map(row => row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\n');
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'результаты.csv';
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast('CSV скачан');
                });
            });
        }

        // ==================== ПРОХОЖДЕНИЕ ====================
        function showStudentFlow(quiz, quizId) {
            const appRoot = document.getElementById('appRoot');

            if (quiz.studentMode) {
                appRoot.innerHTML = `
                    <div class="app-header">
                        <h1>${escapeHtml(quiz.title)}</h1>
                        <div class="sub">${quiz.teacher ? escapeHtml(quiz.teacher) + ' · ' : ''}${quiz.questions.length} вопросов</div>
                    </div>
                    <div class="student-form">
                        <h2>Представьтесь</h2>
                        <div class="sub">Перед началом викторины введите свои данные</div>
                        <div class="field">
                            <label>Имя и фамилия</label>
                            <input type="text" id="studentName" placeholder="Иванов Иван" maxlength="80">
                        </div>
                        <div class="field">
                            <label>Класс (необязательно)</label>
                            <input type="text" id="studentClass" placeholder="8А" maxlength="20">
                        </div>
                        <button class="btn btn-primary btn-block" id="startQuizBtn">Начать викторину</button>
                    </div>
                `;

                $('#startQuizBtn').addEventListener('click', () => {
                    const name = $('#studentName').value.trim();
                    const studentClass = $('#studentClass').value.trim();
                    if (!name) { showToast('Введите имя'); $('#studentName').focus(); return; }
                    runQuizForStudent(quiz, quizId, name, studentClass);
                });

                $('#studentName').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') $('#startQuizBtn').click();
                });
            } else {
                runQuizForStudent(quiz, quizId, '', '');
            }
        }

        function runQuizForStudent(quiz, quizId, studentName, studentClass) {
            const appRoot = document.getElementById('appRoot');

            appRoot.innerHTML = `
                <div class="app-header">
                    <h1>${escapeHtml(quiz.title)}</h1>
                    <div class="sub">
                        ${studentName ? escapeHtml(studentName) + ' · ' : ''}
                        ${quiz.teacher ? escapeHtml(quiz.teacher) + ' · ' : ''}
                        ${quiz.questions.length} вопросов
                    </div>
                </div>
                ${quiz.desc ? `<div style="text-align:center; color:#6b5f4f; margin-bottom:1.5rem; font-style:italic;">${escapeHtml(quiz.desc)}</div>` : ''}
                <div id="runQuiz"></div>
            `;

            const runQuiz = document.getElementById('runQuiz');
            let current = 0, score = 0, answered = false;

            function renderQuestion() {
                if (current >= quiz.questions.length) { renderResult(); return; }
                const q = quiz.questions[current];
                answered = false;

                runQuiz.innerHTML = `
                    <div style="font-family:'Unbounded',sans-serif; font-size:0.75rem; color:#8a7f70; margin-bottom:0.6rem; letter-spacing:1.5px; text-transform:uppercase;">
                        Вопрос ${current + 1} из ${quiz.questions.length}
                    </div>
                    <div style="font-size:1.15rem; font-weight:600; color:#4a4238; margin-bottom:1.2rem; line-height:1.4;">
                        ${escapeHtml(q.text)}
                    </div>
                    <div id="runOptions"></div>
                    <div id="runFeedback" style="margin-top:1rem;"></div>
                `;

                const optionsWrap = document.getElementById('runOptions');
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-secondary btn-block';
                    btn.style.cssText = 'text-align:left; justify-content:flex-start; margin-bottom:0.5rem; padding:0.9rem 1.2rem; font-weight:500;';
                    btn.style.animation = 'cardSlideIn 0.4s ease both';
                    btn.style.animationDelay = (idx * 0.06) + 's';
                    btn.textContent = opt;
                    btn.addEventListener('click', () => selectAnswer(idx));
                    optionsWrap.appendChild(btn);
                });
            }

            function selectAnswer(idx) {
                if (answered) return;
                answered = true;
                const q = quiz.questions[current];
                const buttons = document.querySelectorAll('#runOptions button');
                buttons.forEach((btn, i) => {
                    btn.disabled = true;
                    if (i === q.correct) {
                        btn.style.background = '#e6f0e6';
                        btn.style.borderColor = '#7ba87b';
                        btn.style.color = '#3a5a3a';
                        btn.style.transform = 'translateX(6px)';
                    } else if (i === idx && i !== q.correct) {
                        btn.style.background = '#f5e6e6';
                        btn.style.borderColor = '#c88a8a';
                        btn.style.color = '#7a3a3a';
                    }
                });

                const fb = document.getElementById('runFeedback');
                if (idx === q.correct) {
                    score++;
                    fb.innerHTML = '<span style="color:#5a8a5a; font-weight:600;">Верно</span>';
                } else {
                    fb.innerHTML = `<span style="color:#a85a5a; font-weight:600;">Неверно. Правильный ответ: ${escapeHtml(q.options[q.correct])}</span>`;
                }

                const nextBtn = document.createElement('button');
                nextBtn.className = 'btn btn-primary';
                nextBtn.style.marginTop = '1rem';
                nextBtn.textContent = (current + 1 >= quiz.questions.length) ? 'Показать результат' : 'Следующий вопрос →';
                nextBtn.addEventListener('click', () => { current++; renderQuestion(); });
                fb.appendChild(nextBtn);
                nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            async function renderResult() {
                const percent = Math.round((score / quiz.questions.length) * 100);
                let grade = '', gradeColor = '';
                if (percent === 100) { grade = 'Отлично! Все ответы верны.'; gradeColor = '#5a8a5a'; }
                else if (percent >= 80) { grade = 'Хороший результат!'; gradeColor = '#5a8a5a'; }
                else if (percent >= 50) { grade = 'Неплохо.'; gradeColor = '#a89b6a'; }
                else { grade = 'Стоит повторить.'; gradeColor = '#a85a5a'; }

                if (percent >= 80) throwConfetti();

                let savedMsg = '';
                if (studentName && quizId) {
                    const r = await window.fb.saveResult(quizId, {
                        name: studentName, studentClass,
                        score, total: quiz.questions.length, percent
                    });
                    if (r.ok) savedMsg = '<div style="font-size:0.85rem; color:#7a9a7a; margin-bottom:1.5rem;">✓ Результат отправлен учителю</div>';
                    else savedMsg = '<div style="font-size:0.85rem; color:#b85a5a; margin-bottom:1.5rem;">Не удалось сохранить</div>';
                }

                runQuiz.innerHTML = `
                    <div style="text-align:center; padding:2rem 1rem; animation:panelIn 0.5s ease both;">
                        <div style="font-family:'Unbounded',sans-serif; font-size:0.8rem; color:#8a7f70; text-transform:uppercase; letter-spacing:2px; margin-bottom:0.8rem;">Результат</div>
                        ${studentName ? `<div style="font-size:1rem; color:#4a4238; margin-bottom:0.4rem;">${escapeHtml(studentName)}${studentClass ? ' · ' + escapeHtml(studentClass) : ''}</div>` : ''}
                        <div style="font-family:'Unbounded',sans-serif; font-size:3rem; font-weight:700; color:#4a4238; margin-bottom:0.5rem;">${score} / ${quiz.questions.length}</div>
                        <div style="font-size:1.3rem; color:#8a7f70; margin-bottom:1.5rem;">${percent}%</div>
                        <div style="color:${gradeColor}; font-weight:600; font-size:1.05rem; margin-bottom:1.5rem;">${grade}</div>
                        ${savedMsg}
                        <button class="btn btn-primary" id="retryBtn">Пройти заново</button>
                    </div>
                `;

                document.getElementById('retryBtn').addEventListener('click', () => {
                    current = 0; score = 0; renderQuestion();
                });
            }

            renderQuestion();
        }
    </script>
</body>
</html>
