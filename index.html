<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор викторин для учителей</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {
            getAuth, createUserWithEmailAndPassword,
            signInWithEmailAndPassword, signOut, onAuthStateChanged,
            GoogleAuthProvider, signInWithPopup, updateProfile
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import {
            getFirestore, collection, addDoc, getDocs, getDoc,
            query, where, deleteDoc, doc, serverTimestamp,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBFir3jDFzRUMEG3PjqVBCgYP5uc1edTDE",
            authDomain: "quiz-builder-2ecc7.firebaseapp.com",
            projectId: "quiz-builder-2ecc7",
            storageBucket: "quiz-builder-2ecc7.firebasestorage.app",
            messagingSenderId: "341139715457",
            appId: "1:341139715457:web:b68133ba5b552b53766480"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ===== Гостевой режим (локальный, БЕЗ Firebase Auth) =====
        const GUEST_KEY = 'quiz_guest_session_v1';
        function loadGuest() {
            try {
                const raw = localStorage.getItem(GUEST_KEY);
                if (!raw) return null;
                const g = JSON.parse(raw);
                if (!g || !g.uid) return null;
                return g;
            } catch { return null; }
        }
        function saveGuest(g) {
            try { localStorage.setItem(GUEST_KEY, JSON.stringify(g)); } catch {}
        }
        function clearGuest() {
            try { localStorage.removeItem(GUEST_KEY); } catch {}
        }

        window.fb = {
            auth, db,
            async register(email, password, name) {
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    if (name) await updateProfile(cred.user, { displayName: name });
                    return { ok: true, user: cred.user };
                } catch (e) { return { ok: false, error: translateError(e.code) }; }
            },
            async login(email, password) {
                try {
                    const cred = await signInWithEmailAndPassword(auth, email, password);
                    return { ok: true, user: cred.user };
                } catch (e) { return { ok: false, error: translateError(e.code) }; }
            },
            async loginGoogle() {
                try {
                    const provider = new GoogleAuthProvider();
                    const cred = await signInWithPopup(auth, provider);
                    return { ok: true, user: cred.user };
                } catch (e) { return { ok: false, error: translateError(e.code) }; }
            },
            // Временный гостевой вход — только локально
            loginGuest() {
                const uid = 'guest_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
                const g = { uid, name: 'Гость', isGuest: true, createdAt: Date.now() };
                saveGuest(g);
                return { ok: true, guest: g };
            },
            getGuest() { return loadGuest(); },
            async logout() {
                // Если был firebase-пользователь — выходим из Firebase
                if (auth.currentUser) {
                    try { await signOut(auth); } catch {}
                }
                clearGuest();
            },
            onAuthChange(cb) {
                // Отдаём и firebase-пользователей, и локального гостя
                const emit = (user) => {
                    const guest = loadGuest();
                    if (user) cb({ kind: 'firebase', user });
                    else if (guest) cb({ kind: 'guest', guest });
                    else cb({ kind: 'none' });
                };
                onAuthStateChanged(auth, emit);
                // Дополнительно — если гость есть, а Firebase «пуст», сразу отдаём гостя
                const g = loadGuest();
                if (g && !auth.currentUser) setTimeout(() => emit(null), 0);
            },

            async saveQuiz(quizData) {
                // Кто сохраняет: firebase-user или гость
                let teacherId, teacherEmail, teacherName, isGuest;
                if (auth.currentUser) {
                    teacherId = auth.currentUser.uid;
                    teacherEmail = auth.currentUser.email || '';
                    teacherName = auth.currentUser.displayName || '';
                    isGuest = false;
                } else {
                    const g = loadGuest();
                    if (!g) return { ok: false, error: 'Не авторизован' };
                    teacherId = g.uid;
                    teacherEmail = '';
                    teacherName = g.name || 'Гость';
                    isGuest = true;
                }
                try {
                    const docRef = await addDoc(collection(db, 'quizzes'), {
                        ...quizData,
                        teacherId, teacherEmail, teacherName, isGuest,
                        createdAt: serverTimestamp()
                    });
                    return { ok: true, id: docRef.id };
                } catch (e) { return { ok: false, error: e.message }; }
            },

            async getMyQuizzes() {
                let teacherId;
                if (auth.currentUser) teacherId = auth.currentUser.uid;
                else {
                    const g = loadGuest();
                    if (!g) return [];
                    teacherId = g.uid;
                }
                try {
                    const q = query(collection(db, 'quizzes'), where('teacherId', '==', teacherId));
                    const snap = await getDocs(q);
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    return list;
                } catch (e) { console.error(e); return []; }
            },

            async getQuiz(quizId) {
                try {
                    const d = await getDoc(doc(db, 'quizzes', quizId));
                    if (d.exists()) return { id: d.id, ...d.data() };
                    return null;
                } catch (e) { return null; }
            },

            async deleteQuiz(quizId) {
                try { await deleteDoc(doc(db, 'quizzes', quizId)); return { ok: true }; }
                catch (e) { return { ok: false, error: e.message }; }
            },

            async saveResult(quizId, result) {
                try {
                    await addDoc(collection(db, 'results'), {
                        quizId, ...result, createdAt: serverTimestamp()
                    });
                    return { ok: true };
                } catch (e) { return { ok: false, error: e.message }; }
            },

            subscribeResults(quizId, callback) {
                const q = query(collection(db, 'results'), where('quizId', '==', quizId));
                return onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                    callback(list);
                });
            }
        };

        function translateError(code) {
            const map = {
                'auth/email-already-in-use': 'Этот email уже зарегистрирован',
                'auth/invalid-email': 'Неверный формат email',
                'auth/weak-password': 'Пароль слишком простой (минимум 6 символов)',
                'auth/user-not-found': 'Пользователь не найден',
                'auth/wrong-password': 'Неверный пароль',
                'auth/invalid-credential': 'Неверный email или пароль',
                'auth/too-many-requests': 'Слишком много попыток, попробуйте позже',
                'auth/popup-closed-by-user': 'Окно входа закрыто',
                'auth/network-request-failed': 'Нет подключения к интернету',
                'auth/operation-not-allowed': 'Этот способ входа не включён в Firebase',
                'auth/unauthorized-domain': 'Домен не разрешён в Firebase'
            };
            return map[code] || 'Ошибка: ' + code;
        }

        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>

<body data-theme="warm" class="anim-slide">
    <canvas id="doodleCanvas"></canvas>

    <div class="save-progress" id="saveProgress">
        <div class="save-progress-fill" id="saveProgressFill"></div>
    </div>

    <div class="app" id="appRoot">
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-spinner"></div>
            <div>Загрузка...</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== ДУДЛ-ФОН ====================
        const Doodle = (function() {
            const canvas = document.getElementById('doodleCanvas');
            const ctx = canvas.getContext('2d');
            let width = 0, height = 0, dpr = 1;
            let doodles = [];
            let resizeTimer = null;
            let cfg = {
                style: 'minimal',     // minimal | geometry | nature | space | study
                density: 'medium',    // low | medium | high
                size: 'medium',       // small | medium | large
                intensity: 'medium'   // soft | medium | bright
            };

            const THEME_COLORS = {
                warm: '#6b5f4f', cool: '#4f5f7a', mint: '#3f7a5a',
                lavender: '#6a5a8a', sunset: '#a86a4a', dark: '#c9bba0'
            };

            const STYLE_TYPES = {
                minimal:  ['star', 'circle', 'plus', 'wave'],
                geometry: ['triangle', 'square', 'hex', 'circle', 'plus', 'cross'],
                nature:   ['leaf', 'flower', 'tree', 'wave', 'circle'],
                space:    ['star', 'moon', 'planet', 'comet', 'circle'],
                study:    ['book', 'pencil', 'atom', 'plus', 'triangle', 'star']
            };

            const DENSITY_MUL = { low: 0.6, medium: 1, high: 1.6 };
            const SIZE_MUL = { small: 0.75, medium: 1, large: 1.35 };
            const INTENSITY_ALPHA = { soft: 0.6, medium: 1, bright: 1.5 };

            function currentTheme() { return document.body.getAttribute('data-theme') || 'warm'; }
            function baseColor() { return THEME_COLORS[currentTheme()] || '#6b5f4f'; }
            function colorAlpha(a) {
                const h = baseColor().replace('#', '');
                const r = parseInt(h.substring(0, 2), 16);
                const g = parseInt(h.substring(2, 4), 16);
                const b = parseInt(h.substring(4, 6), 16);
                return `rgba(${r},${g},${b},${a})`;
            }

            function setConfig(newCfg) {
                cfg = { ...cfg, ...newCfg };
                resize();
            }

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                build();
                draw();
            }

            function build() {
                const isMobile = width < 600;
                const area = width * height;
                const baseCount = Math.floor(area / (isMobile ? 22000 : 18000));
                const count = Math.max(12, Math.min(
                    Math.floor(baseCount * DENSITY_MUL[cfg.density]),
                    isMobile ? 45 : 90
                ));

                const types = STYLE_TYPES[cfg.style] || STYLE_TYPES.minimal;
                const sizeBase = (isMobile ? 12 : 18) * SIZE_MUL[cfg.size];

                // Равномерное распределение через jittered-сетку
                const cols = Math.ceil(Math.sqrt(count * (width / height)));
                const rows = Math.ceil(count / cols);
                const cellW = width / cols;
                const cellH = height / rows;

                doodles = [];
                let idx = 0;
                for (let r = 0; r < rows && idx < count; r++) {
                    for (let c = 0; c < cols && idx < count; c++) {
                        const cx = (c + 0.5) * cellW;
                        const cy = (r + 0.5) * cellH;
                        // Случайное смещение в пределах ячейки (jitter)
                        const jitterX = (Math.random() - 0.5) * cellW * 0.7;
                        const jitterY = (Math.random() - 0.5) * cellH * 0.7;
                        const type = types[Math.floor(Math.random() * types.length)];
                        doodles.push({
                            type,
                            x: cx + jitterX,
                            y: cy + jitterY,
                            size: sizeBase * (0.7 + Math.random() * 0.6),
                            rot: Math.random() * Math.PI * 2,
                            alpha: (0.12 + Math.random() * 0.14) * INTENSITY_ALPHA[cfg.intensity],
                            strokeWidth: 1 + Math.random() * 1.3
                        });
                        idx++;
                    }
                }
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (const d of doodles) {
                    ctx.save();
                    ctx.translate(d.x, d.y);
                    ctx.rotate(d.rot);
                    ctx.strokeStyle = colorAlpha(d.alpha);
                    ctx.fillStyle = colorAlpha(d.alpha * 0.85);
                    ctx.lineWidth = d.strokeWidth;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    drawOne(d);
                    ctx.restore();
                }
            }

            function drawOne(d) {
                const s = d.size;
                switch (d.type) {
                    case 'star': {
                        const spikes = 5, outer = s / 2, inner = outer * 0.45;
                        ctx.beginPath();
                        for (let i = 0; i < spikes * 2; i++) {
                            const r = i % 2 === 0 ? outer : inner;
                            const a = (i * Math.PI) / spikes - Math.PI / 2;
                            const px = Math.cos(a) * r, py = Math.sin(a) * r;
                            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.closePath(); ctx.stroke(); break;
                    }
                    case 'circle':
                        ctx.beginPath(); ctx.arc(0, 0, s / 2, 0, Math.PI * 2); ctx.stroke(); break;
                    case 'wave': {
                        ctx.beginPath();
                        const w = s, amp = s * 0.22;
                        ctx.moveTo(-w / 2, 0);
                        for (let x = -w / 2; x <= w / 2; x += 2) {
                            ctx.lineTo(x, Math.sin((x / w) * Math.PI * 2) * amp);
                        }
                        ctx.stroke(); break;
                    }
                    case 'plus':
                        ctx.beginPath();
                        ctx.moveTo(-s / 2, 0); ctx.lineTo(s / 2, 0);
                        ctx.moveTo(0, -s / 2); ctx.lineTo(0, s / 2);
                        ctx.stroke(); break;
                    case 'cross':
                        ctx.beginPath();
                        ctx.moveTo(-s / 2, -s / 2); ctx.lineTo(s / 2, s / 2);
                        ctx.moveTo(s / 2, -s / 2); ctx.lineTo(-s / 2, s / 2);
                        ctx.stroke(); break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(0, -s / 2);
                        ctx.lineTo(s / 2, s / 2);
                        ctx.lineTo(-s / 2, s / 2);
                        ctx.closePath(); ctx.stroke(); break;
                    case 'square':
                        ctx.strokeRect(-s / 2, -s / 2, s, s); break;
                    case 'hex': {
                        ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const a = (i * Math.PI) / 3 - Math.PI / 2;
                            const px = Math.cos(a) * s / 2, py = Math.sin(a) * s / 2;
                            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.closePath(); ctx.stroke(); break;
                    }
                    case 'leaf':
                        ctx.beginPath();
                        ctx.ellipse(0, 0, s / 2, s / 3.5, Math.PI / 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(-s / 2.5, s / 2.5); ctx.lineTo(s / 2.5, -s / 2.5);
                        ctx.stroke(); break;
                    case 'flower': {
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            const a = (i * Math.PI * 2) / 5;
                            const px = Math.cos(a) * s * 0.3, py = Math.sin(a) * s * 0.3;
                            ctx.moveTo(0, 0);
                            ctx.arc(px, py, s * 0.2, 0, Math.PI * 2);
                        }
                        ctx.stroke(); break;
                    }
                    case 'tree':
                        ctx.beginPath();
                        ctx.moveTo(0, s / 2); ctx.lineTo(0, -s / 4);
                        ctx.moveTo(-s / 3, 0); ctx.lineTo(0, -s / 2); ctx.lineTo(s / 3, 0);
                        ctx.stroke(); break;
                    case 'moon':
                        ctx.beginPath();
                        ctx.arc(0, 0, s / 2, 0.5, Math.PI * 1.5);
                        ctx.arc(-s * 0.15, 0, s * 0.35, Math.PI * 1.5, 0.5, true);
                        ctx.stroke(); break;
                    case 'planet':
                        ctx.beginPath(); ctx.arc(0, 0, s * 0.35, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath();
                        ctx.ellipse(0, 0, s / 2, s / 5, Math.PI / 6, 0, Math.PI * 2);
                        ctx.stroke(); break;
                    case 'comet':
                        ctx.beginPath();
                        ctx.arc(s * 0.25, -s * 0.25, s * 0.18, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(s * 0.15, -s * 0.15); ctx.lineTo(-s / 2, s / 2);
                        ctx.stroke(); break;
                    case 'book':
                        ctx.beginPath();
                        ctx.moveTo(-s / 2, -s / 2); ctx.lineTo(0, -s / 3);
                        ctx.lineTo(s / 2, -s / 2); ctx.lineTo(s / 2, s / 2);
                        ctx.lineTo(0, s / 3); ctx.lineTo(-s / 2, s / 2);
                        ctx.closePath(); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(0, -s / 3); ctx.lineTo(0, s / 3);
                        ctx.stroke(); break;
                    case 'pencil':
                        ctx.beginPath();
                        ctx.moveTo(-s / 2, s / 2); ctx.lineTo(-s / 2, s / 3);
                        ctx.lineTo(s / 3, -s / 2); ctx.lineTo(s / 2, -s / 3);
                        ctx.lineTo(-s / 3, s / 2); ctx.closePath(); ctx.stroke(); break;
                    case 'atom':
                        ctx.beginPath(); ctx.arc(0, 0, s * 0.15, 0, Math.PI * 2); ctx.stroke();
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath();
                            ctx.ellipse(0, 0, s / 2, s / 5, (i * Math.PI) / 3, 0, Math.PI * 2);
                            ctx.stroke();
                        }
                        break;
                }
            }

            function scheduleResize() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(resize, 120);
            }

            window.addEventListener('orientationchange', scheduleResize);
            window.addEventListener('doodle-theme-changed', draw);

            const h = hex.replace('#', '');

            const cy = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
            const palette = ['#6b5f4f', '#a89b88', '#e8ddc5', '#d4c5a8', '#c9bba0'];
            const accent = getComputedStyle(document.documentElement).getPropertyValue('--quiz-accent').trim() || '#6b5f4f';
            const count = opts.count || (isMobileDevice() ? 14 : 26);
            const spread = opts.spread || (isMobileDevice() ? 70 : 120);

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const type = Math.random();
                const size = 6 + Math.random() * (isMobileDevice() ? 8 : 12);
                const color = Math.random() < 0.35 ? accent : palette[Math.floor(Math.random() * palette.length)];
                if (type < 0.5) {
                    p.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><path d="M12 2l2.9 6.6L22 9.3l-5.3 4.9 1.5 7.1L12 17.8 5.8 21.3l1.5-7.1L2 9.3l7.1-.7z" fill="${color}"/></svg>`;
                } else if (type < 0.8) {
                    p.style.width = size + 'px'; p.style.height = size + 'px';
                    p.style.borderRadius = '50%'; p.style.background = color;
                    p.style.boxShadow = `0 0 ${size}px ${color}`;

                    p.style.background = color; p.style.transform = 'rotate(45deg)';
                }
                p.style.left = cx + 'px'; p.style.top = cy + 'px';
                container.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const dist = spread * (0.4 + Math.random() * 0.9);
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist - (30 + Math.random() * 60);
                const rot = (Math.random() - 0.5) * 720;
                const dur = 900 + Math.random() * 700;
                const delay = Math.random() * 120;
                p.animate([
                    { transform: `translate(-50%, -50%) translate(0,0) rotate(0deg) scale(0.4)`, opacity: 0 },
                    { transform: `translate(-50%, -50%) translate(${dx * 0.6}px, ${dy * 0.6}px) rotate(${rot * 0.5}deg) scale(1.1)`, opacity: 1, offset: 0.25 },
                    { transform: `translate(-50%, -50%) translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.2)`, opacity: 0 }

        // Сжатие изображения в base64
        function compressImage(file, maxSize, quality) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) { reject(new Error('not image')); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        const scale = Math.min(1, maxSize / Math.max(width, height));
                        width = Math.round(width * scale);
                        height = Math.round(height * scale);
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function createQuestionCard(index) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.index = index;
            card._image = null;

            card.innerHTML = `
                <div class="q-header">
                    <span class="q-num">Вопрос ${index + 1}</span>
                    <button class="btn btn-danger btn-small remove-btn">Удалить</button>
                </div>
                <div class="field" style="margin-bottom:0.8rem;">

                <div class="img-upload q-img-upload" data-qidx="${index}" style="margin-bottom:0.8rem;">

                        <div class="option-row">
                            <input type="radio" name="correct-${index}" value="${n}" ${n === 0 ? 'checked' : ''}>
                            <input type="text" class="opt-text" placeholder="Вариант ${n + 1}" maxlength="200">
                            ${n === 0 ? '<span class="correct-label">верный</span>' : ''}

                    `).join('')}

            `;

            // Радио
            const radios = card.querySelectorAll(`input[name="correct-${index}"]`);
            radios.forEach(radio => {
                radio.addEventListener('change', () => {
                    card.querySelectorAll('.correct-label').forEach(l => l.remove());
                    const checked = card.querySelector(`input[name="correct-${index}"]:checked`);
                    if (checked) {
                        const row2 = checked.closest('.option-row');
                        const span = document.createElement('span');
                        span.className = 'correct-label';
                        span.textContent = 'верный';
                        row2.appendChild(span);
                    }
                });
            });

            // Загрузка картинки к вопросу
            const imgUpload = card.querySelector('.q-img-upload');
            const imgInput = card.querySelector('.q-img-input');
            imgUpload.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-img')) return;
                imgInput.click();
            });
            imgInput.addEventListener('change', async () => {
                const file = imgInput.files[0];
                if (!file) return;
                try {
                    const dataUrl = await compressImage(file, 600, 0.7);
                    card._image = dataUrl;
                    imgUpload.classList.add('has-image');
                    imgUpload.innerHTML = `
                        <input type="file" class="q-img-input" accept="image/*">
                        <img src="${dataUrl}" class="preview" alt="">
                        <div style="font-size:0.75rem;">Нажмите, чтобы заменить</div>
                        <button class="remove-img" type="button" title="Удалить">×</button>
                    `;
                    const newInput = imgUpload.querySelector('.q-img-input');
                    const newRemove = imgUpload.querySelector('.remove-img');

                        if (!f) return;

                            card._image = d;
                            imgUpload.querySelector('img').src = d;
                        } catch { showToast('Не удалось обработать картинку'); }
                    });
                    newRemove.addEventListener('click', (e) => {
                        e.stopPropagation();
                        card._image = null;
                        imgUpload.classList.remove('has-image');
                        imgUpload.innerHTML = `
                            <input type="file" class="q-img-input" accept="image/*">
                            <div class="q-img-content" style="font-size:0.8rem;">🖼️ Картинка к вопросу (необязательно)</div>

        // ==================== СОХРАНЕНИЕ ====================
        async function saveQuizToCloud() {
            const title = $('#quizTitle').value.trim();
            const desc = $('#quizDesc').value.trim();
            const teacher = $('#teacherName').value.trim();
            if (!title) { showToast('Введите название'); return; }

            const cards = questionsWrap.querySelectorAll('.question-card');
            if (cards.length === 0) { showToast('Добавьте хотя бы один вопрос'); return; }

            const questions = [];
            for (let i = 0; i < cards.length; i++) {
                const card = cards[i];
                const text = card.querySelector('.q-text').value.trim();
                const optInputs = card.querySelectorAll('.opt-text');
                const options = Array.from(optInputs).map(inp => inp.value.trim());
                const correctRadio = card.querySelector(`input[name="correct-${i}"]:checked`);
                const correct = correctRadio ? parseInt(correctRadio.value) : 0;

                if (!text) { showToast(`Заполните вопрос №${i + 1}`); card.querySelector('.q-text').focus(); return; }
                const emptyOpt = options.findIndex(o => !o);
                if (emptyOpt !== -1) { showToast(`Заполните все варианты в вопросе №${i + 1}`); optInputs[emptyOpt].focus(); return; }

                questions.push({ text, options, correct, image: card._image || null });
            }

            const result = await window.fb.saveQuiz({
                title, desc, teacher, questions,
                studentMode: state.studentMode,
                theme: state.theme,
                accent: state.accent,
                animation: state.animation,
                doodleStyle: state.doodleStyle,
                doodleDensity: state.doodleDensity,
                doodleSize: state.doodleSize,
                doodleIntensity: state.doodleIntensity,
                cardRadius: state.cardRadius,
                qFontSize: state.qFontSize,
                showProgressBar: state.showProgressBar,
                showCorrectAnswer: state.showCorrectAnswer,
                shuffleQuestions: state.shuffleQuestions,
                shuffleOptions: state.shuffleOptions,
                coverImage: state.coverImage || null
            });

            if (!result.ok) {
                showToast('Ошибка сохранения: ' + result.error);
                return;
            }

            const base = window.location.origin + window.location.pathname;
            $('#shareLink').value = base + '#quiz=' + result.id;
            linkSection.style.display = 'block';
            showToast('Викторина сохранена!');
            spawnParticles(null, { count: isMobileDevice() ? 16 : 30, spread: 140 });
            linkSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            await loadQuizzes();
        }

            }
        });

                item.className = 'saved-item';
                const date = quiz.createdAt
                    ? new Date(quiz.createdAt.seconds * 1000).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                    : '—';
                const cover = quiz.coverImage
                    ? `<img src="${quiz.coverImage}" class="cover-thumb" alt="">`
                    : '';
                item.innerHTML = `
                    <div class="info">
                        ${cover}
                        <div>
                            <div class="title">${escapeHtml(quiz.title)}</div>
                            <div class="meta">${quiz.questions.length} вопр. · ${date}${quiz.studentMode ? ' · режим учеников' : ''}</div>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-secondary btn-small" data-action="link" data-id="${quiz.id}">Ссылка</button>
                        <button class="btn btn-secondary btn-small" data-action="students" data-id="${quiz.id}">Ученики</button>
                        <button class="btn btn-secondary btn-small" data-action="delete" data-id="${quiz.id}">Удалить</button>
                    </div>
                `;
                list.appendChild(item);
            }

            list.querySelectorAll('button[data-action]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;
                    if (action === 'link') {
                        const base = window.location.origin + window.location.pathname;
                        const link = base + '#quiz=' + id;
                        if (navigator.clipboard?.writeText) {
                            navigator.clipboard.writeText(link).then(() => showToast('Ссылка скопирована'))
                            .catch(() => prompt('Скопируйте:', link));
                        } else prompt('Скопируйте:', link);
                    } else if (action === 'students') {
                        $$('.tab-btn').forEach(b => b.classList.remove('active'));
                        $$('.panel').forEach(p => p.classList.remove('active'));
                        document.querySelector('[data-tab="students"]').classList.add('active');
                        $('#panel-students').classList.add('active');
                        renderStudentsPanel(id);
                    } else if (action === 'delete') {
                        const quiz = state.quizzes.find(q => q.id === id);
                        if (confirm('Удалить викторину «' + (quiz?.title || '') + '»?')) {
                            const r = await window.fb.deleteQuiz(id);
                            if (r.ok) { showToast('Удалено'); renderSavedList(); }
                            else showToast('Ошибка: ' + r.error);
                        }
                    }
                });
            });
        }

        // ==================== ПАНЕЛЬ УЧЕНИКОВ ====================
        async function renderStudentsPanel(preselectedId) {
            const select = $('#studentQuizSelect');
            const quizzes = await window.fb.getMyQuizzes();
            state.quizzes = quizzes;
            select.innerHTML = '<option value="">— выберите —</option>';
            quizzes.forEach(q => {
                const opt = document.createElement('option');
                opt.value = q.id; opt.textContent = q.title;
                select.appendChild(opt);
            });
            if (preselectedId) select.value = preselectedId;
            select.onchange = () => renderStudentsContent(select.value);
            if (select.value) renderStudentsContent(select.value);
            else $('#studentsContent').innerHTML = '<div class="empty"><div class="big">—</div><div>Выберите викторину</div></div>';
        }

        function renderStudentsContent(quizId) {
            const content = $('#studentsContent');
            if (!quizId) { content.innerHTML = '<div class="empty"><div class="big">—</div><div>Выберите викторину</div></div>'; return; }
            if (state.unsubscribeResults) { state.unsubscribeResults(); state.unsubscribeResults = null; }
            content.innerHTML = '<div class="loading-screen" style="padding:1.5rem 0;"><div class="loading-spinner" style="width:32px;height:32px;"></div></div>';

            state.unsubscribeResults = window.fb.subscribeResults(quizId, (results) => {
                if (results.length === 0) {
                    content.innerHTML = '<div class="empty"><div class="big">—</div><div>Пока никто не прошёл</div></div>';
                    return;
                }
                const total = results.length;
                const avg = Math.round(results.reduce((s, r) => s + (r.percent || 0), 0) / total);
                const best = Math.max(...results.map(r => r.percent || 0));
                const worst = Math.min(...results.map(r => r.percent || 0));

                let html = `
                    <div class="students-summary">
                        <div class="stat-card"><div class="value">${total}</div><div class="label">прошли</div></div>
                        <div class="stat-card"><div class="value">${avg}%</div><div class="label">средний</div></div>
                        <div class="stat-card"><div class="value">${best}%</div><div class="label">лучший</div></div>
                        <div class="stat-card"><div class="value">${worst}%</div><div class="label">худший</div></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                        <div style="font-family:'Unbounded',sans-serif; font-size:0.9rem; font-weight:600; color:#4a4238;">Список учеников</div>
                        <button class="btn btn-secondary btn-small" id="exportCsvBtn">Скачать CSV</button>
                    </div>
                `;
                html += '<div id="studentsList">';
                results.forEach(r => {
                    const pct = r.percent || 0;
                    const cls = pct >= 80 ? 'good' : (pct >= 50 ? 'mid' : 'bad');
                    const initial = (r.name || '?').trim().charAt(0).toUpperCase();
                    const date = r.createdAt ? new Date(r.createdAt.seconds * 1000).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
                    html += `
                        <div class="student-row">
                            <div class="student-info">
                                <div class="student-avatar">${escapeHtml(initial)}</div>
                                <div>
                                    <div class="student-name">${escapeHtml(r.name)}</div>
                                    <div class="student-class">${r.studentClass ? escapeHtml(r.studentClass) + ' · ' : ''}${date}</div>
                                </div>
                            </div>
                            <div class="student-score ${cls}">${r.score} / ${r.total} · ${pct}%</div>
                        </div>
                    `;
                });
                html += '</div>';
                content.innerHTML = html;

                $('#exportCsvBtn').addEventListener('click', () => {
                    const rows = [['Имя', 'Класс', 'Правильных', 'Всего', 'Процент', 'Дата']];
                    results.forEach(r => {
                        const d = r.createdAt ? new Date(r.createdAt.seconds * 1000).toLocaleString('ru-RU') : '';
                        rows.push([r.name, r.studentClass || '', r.score, r.total, (r.percent || 0) + '%', d]);
                    });
                    const csv = rows.map(row => row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\n');
                    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'результаты.csv'; a.click();
                    URL.revokeObjectURL(url);
                    showToast('CSV скачан');
                });
            });
        }

        // ==================== ПРОХОЖДЕНИЕ ====================
        function showStudentFlow(quiz, quizId) {
            const appRoot = document.getElementById('appRoot');
            if (quiz.studentMode) {
                appRoot.innerHTML = `
                    <div class="app-header">
                        <h1>${escapeHtml(quiz.title)}</h1>
                        <div class="sub">${quiz.teacher ? escapeHtml(quiz.teacher) + ' · ' : ''}${quiz.questions.length} вопросов</div>
                    </div>
                    <div class="student-form question-anim">
                        <h2>Представьтесь</h2>
                        <div class="sub">Перед началом викторины введите свои данные</div>
                        ${quiz.coverImage ? `<img src="${quiz.coverImage}" style="width:100%; max-height:180px; object-fit:cover; border-radius:0.6rem; margin-bottom:1rem;">` : ''}
                        <div class="field"><label>Имя и фамилия</label><input type="text" id="studentName" placeholder="Иванов Иван" maxlength="80"></div>
                        <div class="field"><label>Класс (необязательно)</label><input type="text" id="studentClass" placeholder="8А" maxlength="20"></div>
                        <button class="btn btn-primary btn-block" id="startQuizBtn">Начать викторину</button>
                    </div>
                `;
                $('#startQuizBtn').addEventListener('click', () => {
                    const name = $('#studentName').value.trim();
                    const cls = $('#studentClass').value.trim();
                    if (!name) { showToast('Введите имя'); return; }
                    runQuizForStudent(quiz, quizId, name, cls);
                });
            } else {
                runQuizForStudent(quiz, quizId, '', '');
            }
        }

        function runQuizForStudent(quiz, quizId, studentName, studentClass) {
            const appRoot = document.getElementById('appRoot');
            appRoot.innerHTML = `
                <div class="app-header">
                    <h1>${escapeHtml(quiz.title)}</h1>
                    <div class="sub">${studentName ? escapeHtml(studentName) + ' · ' : ''}${quiz.questions.length} вопросов</div>
                </div>
                ${quiz.desc ? `<div style="text-align:center; color:#6b5f4f; margin-bottom:1.5rem; font-style:italic;">${escapeHtml(quiz.desc)}</div>` : ''}
                <div id="progressBarWrap" style="margin-bottom:1rem;"></div>
                <div id="runQuiz"></div>
            `;

            // Перемешивание
            let questions = quiz.questions.map((q, idx) => ({ ...q, _origIdx: idx }));
            if (quiz.shuffleQuestions) questions = shuffleArray(questions);
            questions = questions.map(q => {
                if (!quiz.shuffleOptions) return q;
                const opts = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                const shuffled = shuffleArray(opts);
                return { ...q, options: shuffled.map(o => o.text), correct: shuffled.findIndex(o => o.isCorrect) };
            });

            const runQuiz = document.getElementById('runQuiz');
            const progressWrap = document.getElementById('progressBarWrap');
            let current = 0, score = 0, answered = false;

            function updateProgress() {
                if (!quiz.showProgressBar) { progressWrap.innerHTML = ''; return; }
                const pct = Math.round((current / questions.length) * 100);
                progressWrap.innerHTML = `
                    <div style="font-size:0.75rem; color:#8a7f70; margin-bottom:0.3rem; display:flex; justify-content:space-between;">
                        <span>Вопрос ${current + 1} из ${questions.length}</span>
                        <span>${pct}%</span>
                    </div>
                    <div style="height:6px; background:rgba(180,170,155,0.25); border-radius:3px; overflow:hidden;">
                        <div style="height:100%; width:${pct}%; background:var(--quiz-accent); transition:width 0.3s ease;"></div>
                    </div>
                `;
            }

            function renderQuestion() {
                if (current >= questions.length) { renderResult(); return; }
                const q = questions[current];
                answered = false;
                updateProgress();

                runQuiz.innerHTML = `
                    <div class="question-anim">
                        <div style="font-size:var(--q-font-size); font-weight:600; color:#4a4238; margin-bottom:1rem; line-height:1.4;">
                            ${escapeHtml(q.text)}
                        </div>
                        ${q.image ? `<img src="${q.image}" style="max-width:100%; max-height:220px; border-radius:0.5rem; margin-bottom:1rem; display:block;">` : ''}
                        <div id="runOptions"></div>
                        <div id="runFeedback" style="margin-top:1rem;"></div>
                    </div>
                `;

                const optionsWrap = document.getElementById('runOptions');
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-secondary btn-block';
                    btn.style.cssText = 'text-align:left; justify-content:flex-start; margin-bottom:0.5rem; padding:0.9rem 1.2rem; font-weight:500;';
                    btn.textContent = opt;
                    btn.addEventListener('click', () => selectAnswer(idx, btn));
                    optionsWrap.appendChild(btn);
                });
            }

            function selectAnswer(idx, clickedBtn) {
                if (answered) return;
                answered = true;
                const q = questions[current];
                const buttons = document.querySelectorAll('#runOptions button');
                buttons.forEach((btn, i) => {
                    btn.disabled = true;
                    if (i === q.correct) {
                        btn.style.background = '#e6f0e6';
                        btn.style.borderColor = '#7ba87b';
                        btn.style.color = '#3a5a3a';
                    } else if (i === idx && i !== q.correct) {
                        btn.style.background = '#f5e6e6';
                        btn.style.borderColor = '#c88a8a';
                        btn.style.color = '#7a3a3a';
                    }
                });

                const fb = document.getElementById('runFeedback');
                if (idx === q.correct) {
                    score++;
                    fb.innerHTML = '<span style="color:#5a8a5a; font-weight:600;">Верно</span>';
                    const correctBtn = buttons[q.correct];
                    if (correctBtn) spawnParticles(correctBtn, { count: isMobileDevice() ? 12 : 20, spread: isMobileDevice() ? 60 : 100 });
                } else {
                    if (quiz.showCorrectAnswer) {
                        fb.innerHTML = `<span style="color:#a85a5a; font-weight:600;">Неверно. Правильный ответ: ${escapeHtml(q.options[q.correct])}</span>`;
                    } else {
                        fb.innerHTML = '<span style="color:#a85a5a; font-weight:600;">Неверно</span>';
                    }
                }

                const nextBtn = document.createElement('button');
                nextBtn.className = 'btn btn-primary';
                nextBtn.style.marginTop = '1rem';
                nextBtn.textContent = (current + 1 >= questions.length) ? 'Показать результат' : 'Следующий вопрос →';
                nextBtn.addEventListener('click', () => { current++; renderQuestion(); });
                fb.appendChild(nextBtn);
                nextBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            async function renderResult() {
                updateProgress();
                const percent = Math.round((score / questions.length) * 100);
                let grade = '', gradeColor = '';
                if (percent === 100) { grade = 'Отлично! Все ответы верны.'; gradeColor = '#5a8a5a'; }
                else if (percent >= 80) { grade = 'Хороший результат!'; gradeColor = '#5a8a5a'; }
                else if (percent >= 50) { grade = 'Неплохо.'; gradeColor = '#a89b6a'; }
                else { grade = 'Стоит повторить.'; gradeColor = '#a85a5a'; }

                if (percent >= 80) spawnParticles(null, { count: isMobileDevice() ? 20 : 40, spread: isMobileDevice() ? 120 : 220 });

                let savedMsg = '';
                if (studentName && quizId) {
                    const r = await window.fb.saveResult(quizId, {
                        name: studentName, studentClass,
                        score, total: questions.length, percent
                    });
                    if (r.ok) savedMsg = '<div style="font-size:0.85rem; color:#7a9a7a; margin-bottom:1.5rem;">✓ Результат отправлен учителю</div>';
                    else savedMsg = '<div style="font-size:0.85rem; color:#b85a5a; margin-bottom:1.5rem;">Не удалось сохранить</div>';
                }

                runQuiz.innerHTML = `
                    <div class="question-anim" style="text-align:center; padding:2rem 1rem;">
                        <div style="font-family:'Unbounded',sans-serif; font-size:0.8rem; color:#8a7f70; text-transform:uppercase; letter-spacing:2px; margin-bottom:0.8rem;">Результат</div>
                        ${studentName ? `<div style="font-size:1rem; color:#4a4238; margin-bottom:0.4rem;">${escapeHtml(studentName)}${studentClass ? ' · ' + escapeHtml(studentClass) : ''}</div>` : ''}
                        <div style="font-family:'Unbounded',sans-serif; font-size:3rem; font-weight:700; color:#4a4238; margin-bottom:0.5rem;">${score} / ${questions.length}</div>
                        <div style="font-size:1.3rem; color:#8a7f70; margin-bottom:1.5rem;">${percent}%</div>
                        <div style="color:${gradeColor}; font-weight:600; font-size:1.05rem; margin-bottom:1.5rem;">${grade}</div>
                        ${savedMsg}
                        <button class="btn btn-primary" id="retryBtn">Пройти заново</button>
                    </div>
                `;
                document.getElementById('retryBtn').addEventListener('click', () => {
                    current = 0; score = 0;
                    if (quiz.shuffleQuestions) questions = shuffleArray(questions);
                    renderQuestion();
                });
            }

            renderQuestion();
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
    </script>
